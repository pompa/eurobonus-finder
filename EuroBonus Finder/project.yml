name: EuroBonus Finder

# ---------------------------------------------------------------------------
# Project options
# ---------------------------------------------------------------------------
options:
  deploymentTarget:
    iOS: "26.2"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  # Mirror the file system in the navigator so nested sources (e.g. the
  # extension's Resources, Resources/images, Resources/_locales) nest under their
  # parent group instead of floating at the project root.
  createIntermediateGroups: true
  # settingPresets: all (default) — supplies the standard CLANG_WARN_* /
  # GCC_WARN_* boilerplate so we only declare settings that actually differ
  # from the Xcode template defaults below.

attributes:
  ORGANIZATIONNAME: Ronald Pompa

# Config names → type (drives the per-config optimization/debug presets).
configs:
  Debug: debug
  Release: release

# Project base configuration (applied to every target/config). Build.xcconfig
# composes the committed version numbers and the placeholder $(APP_BUNDLE_ID)
# with the git-ignored local overrides, so the public project carries neither an
# Apple Developer team nor the real bundle id.
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig

# ---------------------------------------------------------------------------
# Settings shared by every target (project-level build configuration)
# ---------------------------------------------------------------------------
settings:
  base:
    # DEVELOPMENT_TEAM is intentionally NOT set here — it lives in the
    # git-ignored Config/Signing.local.xcconfig (see Config/Build.xcconfig).
    SWIFT_VERSION: "6.0"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ONLY_ACTIVE_ARCH: YES
    ENABLE_TESTABILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Language standards (XcodeGen's presets default to gnu11/gnu++14)
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    # Swift 6 / Xcode 26 feature flags (not in XcodeGen's setting presets)
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Localization / string catalogs
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    # Info.plist keys shared by both targets
    INFOPLIST_KEY_CFBundleDisplayName: EuroBonus Finder
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Ronald Pompa. All rights reserved.
  configs:
    Release:
      PROVISIONING_PROFILE_SPECIFIER: ""
      VALIDATE_PRODUCT: YES

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # SwiftUI host app. Code + assets are recursed from App/, so new files in
  # App/Features, App/DesignSystem, App/Core, etc. are picked up automatically.
  EuroBonus Finder:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist            # referenced via INFOPLIST_FILE, not bundled
          - EBFinder.entitlements # referenced via CODE_SIGN_ENTITLEMENTS
          - "**/.DS_Store"
      - path: App/Info.plist
        buildPhase: none
      - path: App/EBFinder.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: EuroBonus Finder
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/EBFinder.entitlements
        # Override XcodeGen's "iPhone Developer" preset to match the project.
        CODE_SIGN_IDENTITY: Apple Development
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Asset symbol generation OFF on purpose: generated Primary/Secondary
        # symbols collide with SwiftUI. Do not re-enable.
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarHidden: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
    dependencies:
      - target: EuroBonus Finder Extension
        embed: true

  # Safari Web Extension. The web bundle lives in the standard Safari location
  # (Extension/Resources) so it nests naturally under the Extension group.
  EuroBonus Finder Extension:
    type: app-extension
    platform: iOS
    sources:
      - Extension/SafariWebExtensionHandler.swift
      - path: Extension/Info.plist
        buildPhase: none
      - path: Extension/Extension.entitlements
        buildPhase: none
      # Flat web files are recursed (new ones picked up automatically). images
      # and _locales are folder references so their subdirectories survive in
      # the .appex — manifest.json points at images/icon-*.png and the i18n
      # loader reads _locales/<lang>/messages.json. _preview.html is a dev-only
      # preview, excluded from the bundle.
      - path: Extension/Resources
        excludes:
          - manifest.json   # produced by the "Stamp manifest" phase below
          - feed.js         # ditto
          - images
          - _locales
          - _preview.html
          - "**/.DS_Store"
      - path: Extension/Resources/images
        type: folder
      - path: Extension/Resources/_locales
        type: folder
      # Visible in the navigator but NOT copied — the bundled copies are produced
      # by the "Stamp manifest" phase (including them here too would
      # double-produce the files in the .appex).
      - path: Extension/Resources/manifest.json
        buildPhase: none
      - path: Extension/Resources/feed.js
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).extension
        PRODUCT_NAME: EuroBonus Finder Extension
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        SKIP_INSTALL: YES
        # The "Stamp manifest" phase below writes manifest.json into the
        # built .appex. On a *signed* Xcode Cloud archive the user-script sandbox
        # blocks that write ("Operation not permitted" / EPERM) even with declared
        # input/output files; unsigned local builds don't hit it. The script is
        # trivial (seds one version string into one JSON file), so disable
        # sandboxing for this target rather than fight the bundle-write rule.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The manifest's "version" is derived from $MARKETING_VERSION (one source of
    # truth for both the app and the extension), so it's never hard-coded in the
    # committed JSON. The feed host is likewise kept out of the repo: manifest.json
    # and feed.js carry a __FEED_HOST__ placeholder filled from $(FEED_HOST)
    # (Config/Build.xcconfig). Both files are excluded from the resource copy
    # above; this phase generates the bundled copies. Declared
    # input/output keep incremental builds correct; sandboxing is disabled for this
    # target (above) because the sandbox blocks writing into the .appex on signed
    # Xcode Cloud archives.
    postBuildScripts:
      - name: Stamp manifest
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ -z "${FEED_HOST:-}" ]; then
            echo "error: FEED_HOST is not set. Add 'FEED_HOST = feed.example.com' to Config/Feed.local.xcconfig (see workers/eb-feed/README.md)."
            exit 1
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          sed -E -e 's/("version"[[:space:]]*:[[:space:]]*")[^"]+(")/\1'"${MARKETING_VERSION}"'\2/' \
            -e "s/__FEED_HOST__/${FEED_HOST}/g" \
            "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
          sed -e "s/__FEED_HOST__/${FEED_HOST}/g" "$SCRIPT_INPUT_FILE_1" > "$SCRIPT_OUTPUT_FILE_1"
        inputFiles:
          - $(SRCROOT)/Extension/Resources/manifest.json
          - $(SRCROOT)/Extension/Resources/feed.js
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/manifest.json
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/feed.js

  # UI tests that exist only to capture App Store screenshots
  # (`fastlane screenshots`). SnapshotHelper.swift is vendored from fastlane;
  # ScreenshotTests.swift drives the app. Not part of the shipped product.
  EuroBonus Finder UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: EuroBonus Finder
        CODE_SIGN_IDENTITY: Apple Development
        # SnapshotHelper.swift is fastlane's, kept byte-identical so it can be
        # replaced wholesale on upgrade — it is not Swift 6 concurrency clean.
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: EuroBonus Finder

# ---------------------------------------------------------------------------
# Schemes (replaces the hand-maintained EuroBonus Finder.xcscheme)
# ---------------------------------------------------------------------------
schemes:
  EuroBonus Finder:
    build:
      targets:
        EuroBonus Finder: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - EuroBonus Finder UITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
