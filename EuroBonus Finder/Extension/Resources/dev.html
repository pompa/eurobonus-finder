<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="popup.css" />
    <style>
      .dev label { display: flex; gap: 10px; align-items: center; padding: 8px 0; font: var(--text-subheadline); }
      .dev button { margin-top: 12px; }
      .dev .meta { color: var(--secondary-label); font: var(--text-footnote); }
    </style>
  </head>
  <!-- Dev-only page, opened from the popup's "Dev" link: Tutorial progress
       toggles and Reset. Not localized. -->
  <body class="eb-popup">
    <main class="content dev">
      <p><a href="popup.html">‹ Back</a></p>
      <h3>Tutorial progress</h3>
      <label><input type="checkbox" data-step="seenBadge" /> seenBadge</label>
      <label><input type="checkbox" data-step="visitedPartner" /> visitedPartner</label>
      <label><input type="checkbox" data-step="sasShoppingReturn" /> sasShoppingReturn</label>
      <button id="reset" class="btn btn-primary btn-block" type="button">Reset (app + extension)</button>
      <p class="meta">Last reset: <span id="last-reset">never</span></p>
    </main>
    <script src="dev.js"></script>
  </body>
</html>
